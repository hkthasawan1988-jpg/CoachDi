name: Android build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_aab:
        description: Build a signed release AAB using configured signing secrets
        type: boolean
        default: false
      uat_passed:
        description: Confirm real booking/payment and physical Android UAT passed on the selected revision
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test:unit
      - name: Validate isolated public schedule function
        run: |
          npm ci --prefix functions-mobile
          node --check functions-mobile/index.js
          node --check functions-mobile/backfill.cjs
      - run: npm run test:rules
      - run: npx playwright install --with-deps chromium
      - run: npm run test:auth
      - run: npm test
      - run: npx cap sync android
      - name: Clean and build Debug APK; lint Android
        working-directory: android
        run: ./gradlew --no-daemon clean assembleDebug lintDebug
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: coach-di-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-di-reports-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            auth-test-report/
            auth-test-results/
            android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  android-ui:
    needs: debug
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Prepare packaged app
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test packaged app on Android 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          working-directory: android
          script: |
            adb logcat -c
            ./gradlew --no-daemon :app:connectedDebugAndroidTest; result=$?; mkdir -p ../android-ui-evidence; adb logcat -d > ../android-ui-evidence/logcat.txt; adb pull /sdcard/Download/coach-di-uat ../android-ui-evidence/ || true; exit "$result"
      - name: Upload Android UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-di-android-ui-${{ github.sha }}
          path: |
            android-ui-evidence/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_aab && inputs.uat_passed
    needs: [debug, android-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-release
    steps:
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" && -n "$CERT_SHA256" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Release AAB skipped: signing secrets are incomplete.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.signing.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: steps.signing.outputs.ready == 'true'
      - name: Build signed AAB
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/coach-di-release.keystore"
          trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          npm ci
          npm run build
          npx cap sync android
          cd android
          ./gradlew --no-daemon clean bundleRelease
      - name: Upload signed AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coach-di-release-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
