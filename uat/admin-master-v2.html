en;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.urgent strong{font-size:18px}.lower{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px}.bars{height:150px;display:flex;align-items:end;gap:10px;padding-top:18px}.bars i{flex:1;background:#DDEFEA;border-radius:7px 7px 0 0;min-width:18px}.empty{padding:28px;text-align:center;color:#909894;border:1px dashed var(--line);border-radius:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px}.ticket{border-left:4px solid var(--teal)}.ticketTop{display:flex;justify-content:space-between;gap:10px}.person{display:flex;gap:10px;align-items:center;margin:12px 0}.avatar{width:40px;height:40px;border-radius:50%;background:#EBEFEC;display:grid;place-items:center;font-weight:900}.money{font-size:20px;font-weight:900}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.meta div{background:#F7F8F6;border-radius:10px;padding:9px;font-size:11px}.meta b{display:block;margin-top:3px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:900;cursor:pointer}.tabs button.active{background:var(--navy);color:#fff}.crm{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(330px,.8fr);gap:14px}.detail{position:sticky;top:88px;align-self:start}.detailHero{display:flex;align-items:center;gap:12px}.detailHero .avatar{width:56px;height:56px;font-size:18px}.statGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.stat{background:#F7F8F6;border-radius:11px;padding:10px}.stat span{display:block;color:var(--muted);font-size:10px}.stat b{font-size:16px}.field{display:grid;gap:5px;margin-top:10px}.field textarea{border:1px solid var(--line);border-radius:11px;padding:10px;min-height:80px}.refundGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.refundItem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.mask{font-weight:900;letter-spacing:.03em}.modal{position:fixed;inset:0;background:#071A3D88;z-index:100;display:grid;place-items:center;padding:16px}.dialog{width:min(500px,100%);background:#fff;border-radius:20px;padding:18px}.dialog h3{margin-top:0}.login{max-width:420px;margin:10vh auto}.loginCard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}.loginCard h1{margin:0 0 4px}.loginCard input{width:100%;height:45px;border:1px solid var(--line);border-radius:11px;padding:0 12px;margin-top:9px}.loginCard .btn{width:100%;height:45px;margin-top:10px}.loginMsg{font-size:11px;color:var(--muted);margin-top:8px}.mobileMenu{display:none}

<section id="loginView" class="login"><div class="loginCard"><div class="brand" style="color:var(--navy);padding:0 0 16px"><div class="mark" style="background:var(--navy);color:#fff">Di</div><div><b>Coach Di Admin</b><small style="color:var(--muted)">Premium Operations Center • UAT</small></div></div><h1>เข้าสู่ระบบ Admin</h1><div class="muted">ใช้บัญชี Admin ของ Coach Di</div><input id="email" type="email" placeholder="Email" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn" class="btn primary">เข้าสู่ระบบ</button><div id="loginMsg" class="loginMsg"></div></div></section>

<script>
const cfg={apiKey:'AIzaSyCKr76AFSvi6G1N_BF_IfpcsV7VWlzOcIc',authDomain:'coach-di.firebaseapp.com',databaseURL:'https://coach-di-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'coach-di',storageBucket:'coach-di.firebasestorage.app',messagingSenderId:'41680156013',appId:'1:41680156013:web:0c24e900e60495d9189664'};firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.database(),fx=firebase.app().functions('asia-southeast1');
const state={users:[],bookings:[],refunds:[],page:'overview',customer:null};const TODAY=new Date().toISOString().slice(0,10);todayChip.textContent=new Intl.DateTimeFormat('th-TH',{dateStyle:'medium'}).format(new Date());
const menu=[['overview','⌂','ภาพรวม'],['bookings','▣','การจอง'],['schedule','▦','ตารางโค้ช'],['customers','♙','ลูกค้า'],['coaches','♟','โค้ช'],['venues','⌖','สนาม'],['recommended','★','สนามแนะนำ'],['payments','▤','การชำระเงิน'],['refunds','↩','Refund Center'],['ads','▧','Ads Management'],['chats','✉','Chat'],['broadcast','◉','Broadcast'],['settings','⚙','ตั้งค่า'],['audit','☷','Audit Log']];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const baht=s=>'฿'+(Number(s||0)/100).toLocaleString('th-TH',{maximumFractionDigits:0});const fmt=t=>t==null?'-':String(t).padStart(2,'0')+':00';const st=b=>String(b.status||'').toLowerCase();const pending=b=>['pending','pending_verification','pending_coach_approval','payment_uploaded','payment_submitted'].includes(st(b));
function statusClass(s){s=String(s||'');if(['confirmed','completed','paid'].includes(s))return'st-ok';if(s.includes('cancel')||s.includes('declin')||s.includes('reject'))return'st-bad';if(s==='processing')return'st-blue';return'st-pending'}function statusLabel(s){return({pending:'รอดำเนินการ',pending_verification:'รอตรวจสอบ',pending_coach_approval:'รอโค้ชอนุมัติ',confirmed:'ยืนยันแล้ว',completed:'เสร็จสิ้น',cancelled:'ยกเลิก',declined:'ปฏิเสธ',requested:'รอคืนเงิน',processing:'กำลังดำเนินการ',paid:'คืนเงินแล้ว'}[s]||s||'-')}
function renderNav(){nav.innerHTML=menu.map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="go('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('')}function go(p){state.page=p;state.customer=null;topTitle.textContent=menu.find(x=>x[0]===p)?.[2]||p;renderNav();render()}
async function load(){const [u,b,r]=await Promise.all([db.ref('users').once('value'),db.ref('bookings').once('value'),db.ref('refunds').once('value')]);state.users=Object.entries(u.val()||{}).map(([id,v])=>({id,...v}));state.bookings=Object.entries(b.val()||{}).map(([id,v])=>({id,...v}));state.refunds=Object.entries(r.val()||{}).map(([id,v])=>({id,...v}));render()}
function render(){({overview,bookings,schedule,customers,coaches,venues,recommended,payments,refunds,ads,chats,broadcast,settings,audit}[state.page]||placeholder)()}
function overview(){const bs=state.bookings,today=bs.filter(b=>b.date===TODAY),slips=bs.filter(b=>(b.paymentProofDataUrl||b.paymentProofPath)&&!['payment_verified','confirmed'].includes(b.paymentStatus||b.status)),wait=bs.filter(pending),conflict=bs.filter(b=>b.travelConflict===true||b.travelStatus==='conflict'),refund=state.refunds.filter(x=>['requested','processing'].includes(x.status)),rev=bs.filter(b=>b.date===TODAY&&['confirmed','completed'].includes(st(b))).reduce((a,b)=>a+Number(b.amountSatang||b.totalSatang||b.priceSatang||0),0),rows=bs.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,12);content.innerHTML=`<div class="hero"><div><h2>ศูนย์จัดการ Coach Di</h2><div class="muted">Booking, SLA, Payment, Travel Conflict และ Refund — สิ่งที่ต้องจัดการก่อน</div></div><div class="search"><input placeholder="ค้นหา Booking ID / ชื่อ / เบอร์โทร"><input type="date" value="${TODAY}"></div></div><div class="kpis">${[['Booking วันนี้',today.length,''],['รอตรวจสลิป',slips.length,''],['รอโค้ชอนุมัติ',wait.length,''],['Travel Conflict',conflict.length,'alert'],['รอคืนเงิน',refund.length,refund.length?'alert':''],['รายได้วันนี้',baht(rev),'']].map(x=>`<div class="kpi ${x[2]}"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="grid"><section class="panel"><div class="panelHead"><div><h3>รายการที่ต้องดำเนินการ</h3><div class="muted">เรียงงานใหม่และงานที่มี SLA ก่อน</div></div><button class="btn" onclick="go('bookings')">ดูทั้งหมด</button></div>${bookingTable(rows)}</section><aside class="panel"><h3>ต้องจัดการด่วน</h3>${[['Travel Conflict',conflict.length],['สลิปรอตรวจ',slips.length],['Coach Approval',wait.length],['Refund Pending',refund.length]].map(x=>`<div class="urgent"><b>${x[0]}</b><strong>${x[1]}</strong></div>`).join('')}</aside></div><div class="lower"><section class="panel"><h3>ตารางสอนวันนี้</h3>${today.slice(0,5).map(b=>`<div class="urgent"><span>${fmt(b.start)} ${esc(b.coachName||b.coachDisplayName||'Coach')}</span><b>${esc(b.venue||'-')}</b></div>`).join('')||'<div class="empty">ไม่มีคลาสวันนี้</div>'}</section><section class="panel"><h3>Revenue Trend</h3><div class="bars">${[38,52,46,68,74,61,86].map(v=>`<i style="height:${v}%"></i>`).join('')}</div></section><section class="panel"><h3>Customer Overview</h3><div class="urgent"><b>นักกีฬา</b><strong>${state.users.filter(x=>x.role==='athlete').length}</strong></div><div class="urgent"><b>Coach</b><strong>${state.users.filter(x=>x.role==='coach').length}</strong></div><div class="urgent"><b>Booking ทั้งหมด</b><strong>${bs.length}</strong></div></section></div>`}
function bookingTable(rows){return `<div class="tableWrap"><table class="tbl"><thead><tr><th>Booking ID</th><th>นักกีฬา</th><th>Coach</th><th>วัน/เวลา</th><th>สนาม/Court</th><th>Payment</th><th>สถานะ</th><th>SLA</th><th></th></tr></thead><tbody>${rows.map(b=>`<tr><td><b>#${esc(b.id)}</b></td><td><b>${esc(b.athleteName||b.athlete||'-')}</b><br>${esc(b.phone||'')}</td><td>${esc(b.coachName||b.coachDisplayName||b.coachId||'-')}</td><td>${esc(b.date||'-')}<br>${fmt(b.start)}–${fmt(b.end)}</td><td>${esc(b.venue||b.venueName||'-')}<br>${esc(b.courtNumber||b.court||'')}</td><td>${esc(b.paymentStatus||'-')}</td><td><span class="status ${statusClass(st(b))}">${esc(statusLabel(st(b)))}</span></td><td>${pending(b)?'<b style="color:var(--red)">เร่งด่วน</b>':'-'}</td><td><button class="btn" onclick="openBooking('${esc(b.id)}')">ดู Ticket</button></td></tr>`).join('')||'<tr><td colspan="9"><div class="empty">ยังไม่มี Booking</div></td></tr>'}</tbody></table></div>`}
function bookings(){content.innerHTML=`<div class="hero"><div><h2>การจองทั้งหมด</h2><div class="muted">Booking Operations • Ticket-first workflow</div></div><div class="search"><select><option>ทุกสถานะ</option><option>รอตรวจสลิป</option><option>รอโค้ชอนุมัติ</option><option>ยืนยันแล้ว</option></select><input placeholder="ค้นหา Booking"></div></div><div class="cards">${state.bookings.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(ticket).join('')||'<div class="empty">ยังไม่มี Booking</div>'}</div>`}
function ticket(b){return `<article class="card ticket"><div class="ticketTop"><div><span class="status ${statusClass(st(b))}">${pending(b)?'NEW • ':''}${esc(statusLabel(st(b)))}</span><h3 style="margin:7px 0 0">#${esc(b.id)}</h3></div><div class="money">${baht(b.amountSatang||b.totalSatang||b.priceSatang||0)}</div></div><div class="person"><div class="avatar">${esc((b.athleteName||b.athlete||'?').slice(0,1))}</div><div><b>${esc(b.athleteName||b.athlete||'นักกีฬา')}</b><div class="muted">${esc(b.phone||'-')}</div></div></div><div class="meta"><div>วัน / เวลา<b>${esc(b.date||'-')} • ${fmt(b.start)}–${fmt(b.end)}</b></div><div>สนาม / Court<b>${esc(b.venue||b.venueName||'-')} • ${esc(b.courtNumber||b.court||'-')}</b></div><div>Coach<b>${esc(b.coachName||b.coachDisplayName||b.coachId||'-')}</b></div><div>Slip / Payment<b>${b.paymentProofDataUrl||b.paymentProofPath?'มีสลิป':'ไม่มีสลิป'} • ${esc(b.paymentStatus||'-')}</b></div></div>${b.athleteNote||b.note?`<div style="margin-top:9px" class="muted">Note: ${esc(b.athleteNote||b.note)}</div>`:''}<div class="actions"><button class="btn" onclick="openBooking('${esc(b.id)}')">รายละเอียด</button><button class="btn">Chat</button></div></article>`}
function openBooking(id){const b=state.bookings.find(x=>x.id===id);if(!b)return;modalBody.innerHTML=`<h3>Booking Ticket #${esc(id)}</h3>${ticket(b)}<div class="muted" style="margin-top:10px">Production action buttons จะเชื่อมผ่าน Server Booking Service เพื่อ Approve/Decline อย่าง atomic</div>`;modal.classList.remove('hidden')}
function schedule(){const today=state.bookings.filter(b=>b.date===TODAY).sort((a,b)=>Number(a.start||0)-Number(b.start||0));content.innerHTML=`<div class="hero"><div><h2>ตารางโค้ช</h2><div class="muted">Weekly operations • ห้ามเวลา overlap และคำนึงถึง Travel Buffer 45 นาที</div></div></div><div class="panel">${today.map(b=>`<div class="urgent"><span><b>${fmt(b.start)}–${fmt(b.end)}</b> • ${esc(b.coachName||b.coachId||'Coach')}</span><span>${esc(b.venue||'-')}</span></div>`).join('')||'<div class="empty">ไม่มีตารางวันนี้</div>'}</div>`}
function customers(){const users=state.users.filter(x=>x.role==='athlete');content.innerHTML=`<div class="hero"><div><h2>Manage Customer</h2><div class="muted">CRM • Search, Filter, Export และ Customer Detail Panel ในหน้าเดียว</div></div><div class="search"><input id="crmSearch" placeholder="ชื่อ / เบอร์ / Email" oninput="crmFilter()"><select><option>ทั้งหมด</option><option>Active</option><option>Inactive</option></select><button class="btn">Export</button></div></div><div class="crm"><section class="panel"><div id="crmTable">${customerTable(users)}</div></section><aside id="customerDetail" class="panel detail">${customerDetail(null)}</aside></div>`}
function customerTable(rows){return `<div class="tableWrap"><table class="tbl" style="min-width:800px"><thead><tr><th>ลูกค้า</th><th>Contact</th><th>Status</th><th>Classes</th><th>Cancel</th><th>Spend</th><th>Last Active</th><th></th></tr></thead><tbody>${rows.map(u=>{const bs=state.bookings.filter(b=>b.athleteId===u.id),sp=bs.reduce((a,b)=>a+Number(b.amountSatang||b.totalSatang||0),0);return`<tr><td><b>${esc(u.displayName||u.name||'Athlete')}</b></td><td>${esc(u.email||'')}<br>${esc(u.phone||'')}</td><td><span class="status ${u.status==='inactive'?'st-bad':'st-ok'}">${esc(u.status||'active')}</span></td><td>${bs.length}</td><td>${bs.filter(b=>st(b).includes('cancel')).length}</td><td>${baht(sp)}</td><td>${u.lastActiveAt?new Date(u.lastActiveAt).toLocaleDateString('th-TH'):'-'}</td><td><button class="btn" onclick="selectCustomer('${u.id}')">เปิด CRM</button></td></tr>`}).join('')||'<tr><td colspan="8"><div class="empty">ยังไม่มีลูกค้า</div></td></tr>'}</tbody></table></div>`}
function selectCustomer(id){state.customer=state.users.find(x=>x.id===id);customerDetailEl=document.getElementById('customerDetail');if(customerDetailEl)customerDetailEl.innerHTML=customerDetail(state.customer)}function customerDetail(u){if(!u)return'<div class="empty">เลือกลูกค้าเพื่อดู Customer Detail</div>';const bs=state.bookings.filter(b=>b.athleteId===u.id),sp=bs.reduce((a,b)=>a+Number(b.amountSatang||b.totalSatang||0),0),latest=bs.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];return`<div class="detailHero"><div class="avatar">${esc((u.displayName||u.name||'?').slice(0,1))}</div><div><h3>${esc(u.displayName||u.name||'Athlete')}</h3><div class="muted">${esc(u.email||'')} • ${esc(u.phone||'')}</div></div></div><div class="actions"><button class="btn primary">Chat</button><button class="btn">Call</button><button class="btn">Edit</button></div><div class="statGrid"><div class="stat"><span>Classes</span><b>${bs.length}</b></div><div class="stat"><span>Total Spend</span><b>${baht(sp)}</b></div><div class="stat"><span>Cancellations</span><b>${bs.filter(b=>st(b).includes('cancel')).length}</b></div><div class="stat"><span>Latest Payment</span><b>${esc(latest?.paymentStatus||'-')}</b></div></div><h3 style="margin-top:16px">Booking History</h3>${bs.slice(0,5).map(b=>`<div class="urgent"><span>${esc(b.date||'-')} • ${fmt(b.start)}</span><b>${esc(b.venue||'-')}</b></div>`).join('')||'<div class="muted">ไม่มีประวัติ</div>'}<div class="field"><label>Internal Note</label><textarea placeholder="หมายเหตุสำหรับทีม Admin เท่านั้น"></textarea></div>`}
function crmFilter(){const q=document.getElementById('crmSearch').value.toLowerCase(),rows=state.users.filter(x=>x.role==='athlete'&&[x.displayName,x.name,x.email,x.phone].some(v=>String(v||'').toLowerCase().includes(q)));document.getElementById('crmTable').innerHTML=customerTable(rows)}
function coaches(){const rows=state.users.filter(x=>x.role==='coach');content.innerHTML=`<div class="hero"><div><h2>จัดการโค้ช</h2><div class="muted">Profile, status, subscription และ performance</div></div></div><div class="cards">${rows.map(u=>`<div class="card"><div class="person"><div class="avatar">${esc((u.displayName||'C').slice(0,1))}</div><div><b>${esc(u.displayName||u.email||u.id)}</b><div class="muted">${esc(u.email||'')}</div></div></div><span class="status ${u.status==='active'?'st-ok':'st-pending'}">${esc(u.status||'pending')}</span></div>`).join('')||'<div class="empty">ยังไม่มี Coach</div>'}</div>`}
function refunds(){const rows=state.refunds,req=rows.filter(x=>x.status==='requested').length,pro=rows.filter(x=>x.status==='processing').length,paid=rows.filter(x=>x.status==='paid').length,total=rows.filter(x=>x.status==='paid').reduce((a,x)=>a+Number(x.amountSatang||0),0);content.innerHTML=`<div class="hero"><div><h2>Refund Center</h2><div class="muted">รอคืนเงิน → กำลังดำเนินการ → คืนเงินแล้ว • เลขบัญชีเต็มเปิดผ่าน Server + Audit เท่านั้น</div></div></div><div class="refundGrid">${[['รอคืนเงิน',req],['กำลังดำเนินการ',pro],['คืนเงินแล้ว',paid],['คืนแล้วรวม',baht(total)]].map(x=>`<div class="kpi"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="panel"><div class="tableWrap"><table class="tbl"><thead><tr><th>Refund ID</th><th>Booking</th><th>นักกีฬา</th><th>จำนวน</th><th>บัญชี</th><th>สถานะ</th><th>Requested</th><th></th></tr></thead><tbody>${rows.slice().sort((a,b)=>(b.requestedAt||0)-(a.requestedAt||0)).map(r=>`<tr><td><b>#${esc(r.id)}</b></td><td>${esc(r.bookingId||'-')}</td><td>${esc(r.athleteName||r.accountName||r.athleteId||'-')}</td><td><b>${baht(r.amountSatang)}</b></td><td>${esc(r.bankName||'-')} <span class="mask">${esc(r.maskedAccountNumber||'')}</span></td><td><span class="status ${statusClass(r.status)}">${statusLabel(r.status)}</span></td><td>${r.requestedAt?new Date(r.requestedAt).toLocaleString('th-TH'):'-'}</td><td><div class="actions" style="margin:0">${r.status==='requested'?`<button class="btn" onclick="refundProcessing('${esc(r.id)}')">เริ่มดำเนินการ</button>`:''}<button class="btn" onclick="refundInstruction('${esc(r.id)}')">ดูข้อมูลโอน</button>${r.status!=='paid'?`<button class="btn teal" onclick="refundPaid('${esc(r.id)}')">คืนเงินแล้ว</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="8"><div class="empty">ยังไม่มี Refund</div></td></tr>'}</tbody></table></div></div>`}
async function refundProcessing(id){try{await fx.httpsCallable('setRefundProcessing')({refundId:id});await load()}catch(e){alert('Function ยังไม่พร้อมหรือดำเนินการไม่สำเร็จ: '+e.message)}}async function refundPaid(id){if(!confirm('ยืนยันว่าโอนคืนเงินเรียบร้อยแล้ว?'))return;try{await fx.httpsCallable('markRefundPaid')({refundId:id});await load()}catch(e){alert('Function ยังไม่พร้อมหรือดำเนินการไม่สำเร็จ: '+e.message)}}async function refundInstruction(id){try{const x=(await fx.httpsCallable('getRefundInstruction')({refundId:id})).data;modalBody.innerHTML=`<h3>ข้อมูลสำหรับโอนคืนเงิน</h3><div class="card"><b>${esc(x.bankName||'')}</b><div>${esc(x.accountName||'')}</div><div style="font-size:24px;font-weight:900;margin-top:8px">${esc(x.accountNumber||'')}</div></div><div class="muted">การเปิดข้อมูลนี้ถูกบันทึกใน Audit Log</div>`;modal.classList.remove('hidden')}catch(e){alert('Function ยังไม่พร้อมหรือไม่มีสิทธิ์: '+e.message)}}
function venues(){placeholder('Venue Master')}function recommended(){placeholder('สนามแนะนำ')}function payments(){placeholder('การชำระเงิน')}function ads(){placeholder('Ads Management')}function chats(){placeholder('Chat Center')}function broadcast(){placeholder('Broadcast')}function settings(){placeholder('ตั้งค่า')}function audit(){placeholder('Audit Log')}function placeholder(name){content.innerHTML=`<div class="hero"><div><h2>${esc(name||topTitle.textContent)}</h2><div class="muted">Module นี้จะใช้ design system เดียวกับ Admin Master</div></div></div><div class="panel"><div class="empty">UAT UI shell พร้อมแล้ว • เชื่อม business module เดิมในขั้น integration</div></div>`}
function closeModal(){modal.classList.add('hidden')}window.closeModal=closeModal;window.go=go;window.openBooking=openBooking;window.selectCustomer=selectCustomer;window.crmFilter=crmFilter;window.refundProcessing=refundProcessing;window.refundPaid=refundPaid;window.refundInstruction=refundInstruction;
loginBtn.onclick=async()=>{try{loginMsg.textContent='กำลังเข้าสู่ระบบ...';await auth.signInWithEmailAndPassword(email.value.trim(),password.value)}catch(e){loginMsg.textContent='เข้าสู่ระบบไม่สำเร็จ: '+e.message}};logoutBtn.onclick=()=>auth.signOut();auth.onAuthStateChanged(async u=>{if(!u){loginView.classList.remove('hidden');app.classList.add('hidden');return}try{const profile=(await db.ref('users/'+u.uid).once('value')).val()||{};if(profile.role!=='admin'){await auth.signOut();loginMsg.textContent='บัญชีนี้ไม่ใช่ Admin';return}adminName.textContent=profile.displayName||u.email||'Admin';loginView.classList.add('hidden');app.classList.remove('hidden');renderNav();await load()}catch(e){loginMsg.textContent='โหลด Admin ไม่สำเร็จ: '+e.message}});
</script></body></html>
